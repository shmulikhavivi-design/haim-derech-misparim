# חיים דרך מספרים — פעולות Production (הסביבה "production" ב-GitHub בלבד)
# רץ רק ב-push לענף production-ops/run. המצב נקבע לפי [prod:<mode>] בשורת הנושא; בלי סימון = check (קריאה בלבד).
# authcfg / migrate / confirmon משנים את Production — מופעלים רק אחרי אישור מפורש של הבעלים בצ'אט.
# הסודות (Environment Secrets בסביבה production): PRODUCTION_DB_URL, PRODUCTION_SUPABASE_TOKEN, BREVO_SMTP_KEY. אף ערך לא מודפס.
name: Production ops
on: { push: { branches: [ 'production-ops/run' ] } }
permissions: { contents: read }
concurrency: { group: production-ops, cancel-in-progress: false }
jobs:
  prod:
    if: github.repository == 'shmulikhavivi-design/haim-derech-misparim' && github.ref == 'refs/heads/production-ops/run' && !contains(github.event.head_commit.message, '[prod:cleanup]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Choose mode
        id: mode
        env: { COMMIT_MSG: '${{ github.event.head_commit.message }}' }
        run: |
          mode=$(printf '%s\n' "$COMMIT_MSG" | head -n1 | sed -n 's/.*\[prod:\([a-z]*\)\].*/\1/p'); mode="${mode:-check}"
          case "$mode" in custcheck|livecheckthree|livechecktwo|goliveapply|livecheck|termsrehearse|stagebready|stagecverify|mailtest|mailchain|ownerrenewoff|postadmin|launchcheck|hideapply|adminpreview|hiderehearse|ownerhidecheck|adminapply|adminrehearse|incidentnine|incidenteight|incidentseven|incidentsix|incidentfive|incidentfour|incidentthree|incidenttwo|incident|stagecapply|stagecrehearse|readiness|cronnow|stagearehearse|stageaapply|ownercardsync|cardlink|paycheck|payreplay|secretfix|secretcmp|paydiag|purgerehearseleftovers|purgeapplyleftovers|purgerehearsedina|purgeapplydina|vipsoon|backupdrop|purgerehearse|purgeapply|ownerverifyfree|ownerfree|secureread|ownercheck|cronrehearse|cronapply|billingtests|billingdeploy|billingdeploycheck|billingprep|plusext|testcleanup|testcheck|advisors|confirmplan|emailfix|emailcheck|plusapply|plusplan|smoke|postcheck|check|authplan|keycheck|smtptest|supamail|maildiag|ownertest|fingerprint|export|rehearse|simulate|authcfg|migrate|confirmon|secrets) ;; *) echo "unknown mode $mode"; exit 1;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Secret names (presence only)
        if: steps.mode.outputs.mode == 'secrets'
        env:
          NAMES: 'PRODUCTION_DB_URL PROD_DB_URL SUPABASE_DB_URL DATABASE_URL DB_URL SUPABASE_DB_PASSWORD PRODUCTION_DB_PASSWORD PRODUCTION_SUPABASE_TOKEN SUPABASE_ACCESS_TOKEN SUPABASE_TOKEN SUPABASE_PAT SUPABASE_MANAGEMENT_TOKEN SUPABASE_SERVICE_ROLE_KEY SUPABASE_SERVICE_KEY SUPABASE_SECRET_KEY SUPABASE_KEY BREVO_SMTP_KEY BREVO_API_KEY BREVO_KEY SMTP_PASSWORD SMTP_PASS STAGING_DB_URL SUPABASE_STAGING_READ_TOKEN MORNING_CLIENT_ID MORNING_CLIENT_SECRET MORNING_API_KEY MORNING_WEBHOOK_SECRET MORNING_NOTIFY_TOKEN GROW_API_KEY GROW_CLIENT_ID GROW_USER_ID GROW_PAGE_CODE STAGING_FUNCTIONS_TOKEN SENDINBLUE_API_KEY SIB_API_KEY BREVO_API BREVO_TOKEN MAIL_API_KEY EMAIL_API_KEY SMTP_KEY BREVO_SMTP_PASSWORD BREVO_PASSWORD MAIL_FROM'
          PRODUCTION_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_URL: ${{ secrets.DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          PRODUCTION_SUPABASE_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_KEY: ${{ secrets.BREVO_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          SUPABASE_STAGING_READ_TOKEN: ${{ secrets.SUPABASE_STAGING_READ_TOKEN }}
          MORNING_CLIENT_ID: ${{ secrets.MORNING_CLIENT_ID }}
          MORNING_CLIENT_SECRET: ${{ secrets.MORNING_CLIENT_SECRET }}
          MORNING_API_KEY: ${{ secrets.MORNING_API_KEY }}
          MORNING_WEBHOOK_SECRET: ${{ secrets.MORNING_WEBHOOK_SECRET }}
          MORNING_NOTIFY_TOKEN: ${{ secrets.MORNING_NOTIFY_TOKEN }}
          GROW_API_KEY: ${{ secrets.GROW_API_KEY }}
          GROW_CLIENT_ID: ${{ secrets.GROW_CLIENT_ID }}
          GROW_USER_ID: ${{ secrets.GROW_USER_ID }}
          GROW_PAGE_CODE: ${{ secrets.GROW_PAGE_CODE }}
          STAGING_FUNCTIONS_TOKEN: ${{ secrets.STAGING_FUNCTIONS_TOKEN }}
          SENDINBLUE_API_KEY: ${{ secrets.SENDINBLUE_API_KEY }}
          SIB_API_KEY: ${{ secrets.SIB_API_KEY }}
          BREVO_API: ${{ secrets.BREVO_API }}
          BREVO_TOKEN: ${{ secrets.BREVO_TOKEN }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          SMTP_KEY: ${{ secrets.SMTP_KEY }}
          BREVO_SMTP_PASSWORD: ${{ secrets.BREVO_SMTP_PASSWORD }}
          BREVO_PASSWORD: ${{ secrets.BREVO_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          VAR_BREVO: ${{ vars.BREVO_API_KEY }}
          VAR_BREVO2: ${{ vars.BREVO_KEY }}
        run: |
          echo "::notice title=vars-brevo::BREVO_API_KEY כמשתנה (Variable, לא סוד): $([ -n "$VAR_BREVO" ] && echo "קיים, אורך ${#VAR_BREVO}" || echo לא קיים) | BREVO_KEY כמשתנה: $([ -n "$VAR_BREVO2" ] && echo "קיים, אורך ${#VAR_BREVO2}" || echo לא קיים)"
          bash scripts/production/secret_names.sh production-env-plus-repo
      - name: psql
        if: steps.mode.outputs.mode != 'secrets'
        run: if [ "${{ steps.mode.outputs.mode }}" = simulate ]; then sudo apt-get update -q && sudo apt-get install -y -q postgresql postgresql-client && (sudo systemctl stop postgresql || true); else command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client); fi
      - name: Supabase CLI (billing deploy only)
        if: startsWith(steps.mode.outputs.mode, 'billingdeploy') || steps.mode.outputs.mode == 'stageaapply' || steps.mode.outputs.mode == 'stagecapply'
        uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Run
        if: steps.mode.outputs.mode != 'secrets'
        env:
          PRODUCTION_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
          PRODUCTION_SUPABASE_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          MORNING_CLIENT_ID: ${{ (startsWith(steps.mode.outputs.mode, 'billingdeploy') || steps.mode.outputs.mode == 'ownercheck' || steps.mode.outputs.mode == 'secretcmp' || steps.mode.outputs.mode == 'readiness' || steps.mode.outputs.mode == 'secretfix' || steps.mode.outputs.mode == 'paycheck' || steps.mode.outputs.mode == 'payreplay' || steps.mode.outputs.mode == 'cardlink' || steps.mode.outputs.mode == 'ownercardsync') && secrets.MORNING_CLIENT_ID || '' }}
          MORNING_CLIENT_SECRET: ${{ (startsWith(steps.mode.outputs.mode, 'billingdeploy') || steps.mode.outputs.mode == 'ownercheck' || steps.mode.outputs.mode == 'secretcmp' || steps.mode.outputs.mode == 'readiness' || steps.mode.outputs.mode == 'secretfix' || steps.mode.outputs.mode == 'paycheck' || steps.mode.outputs.mode == 'payreplay' || steps.mode.outputs.mode == 'cardlink' || steps.mode.outputs.mode == 'ownercardsync') && secrets.MORNING_CLIENT_SECRET || '' }}
          GH_BREVO_API: ${{ (steps.mode.outputs.mode == 'readiness' || steps.mode.outputs.mode == 'livecheck' || steps.mode.outputs.mode == 'livechecktwo' || steps.mode.outputs.mode == 'livecheckthree' || steps.mode.outputs.mode == 'custcheck' || steps.mode.outputs.mode == 'stagecapply' || steps.mode.outputs.mode == 'incidentfour' || steps.mode.outputs.mode == 'incidentsix' || steps.mode.outputs.mode == 'hiderehearse' || steps.mode.outputs.mode == 'launchcheck' || steps.mode.outputs.mode == 'mailchain' || steps.mode.outputs.mode == 'mailtest') && secrets.BREVO_API_KEY || '' }}
          GH_BREVO_SMTP: ${{ steps.mode.outputs.mode == 'readiness' && secrets.BREVO_SMTP_KEY || '' }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: bash scripts/production/run.sh "${{ steps.mode.outputs.mode }}"
      - name: Upload smoke screenshots
        if: always() && steps.mode.outputs.mode == 'smoke'
        uses: actions/upload-artifact@v4
        with: { name: smoke, path: '${{ runner.temp }}/smoke/', retention-days: 3, if-no-files-found: ignore }
      - name: Upload encrypted backup
        if: steps.mode.outputs.mode == 'export' || steps.mode.outputs.mode == 'secureread' || steps.mode.outputs.mode == 'paydiag' || steps.mode.outputs.mode == 'cardlink'
        uses: actions/upload-artifact@v4
        with:
          name: hdm-backup-encrypted
          path: ${{ runner.temp }}/hdm-export/out/
          retention-days: 1
          if-no-files-found: error
  transfer:
    # מעביר את הגיבוי המוצפן בלבד לענף זמני (בלי סודות, בלי environment). נמחק מיד אחרי ההורדה.
    needs: prod
    if: github.repository == 'shmulikhavivi-design/haim-derech-misparim' && github.ref == 'refs/heads/production-ops/run' && (contains(github.event.head_commit.message, '[prod:export]') || contains(github.event.head_commit.message, '[prod:secureread]') || contains(github.event.head_commit.message, '[prod:paydiag]') || contains(github.event.head_commit.message, '[prod:cardlink]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: hdm-backup-encrypted, path: out }
      - name: Push encrypted files to a temporary branch
        env: { GH_TOKEN: '${{ github.token }}', RUN: '${{ github.run_id }}' }
        run: |
          cd out && ls -l
          git init -q -b tmp && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add backup.tgz.enc key.enc && git commit -q -m "encrypted backup transfer $RUN (temporary)"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "tmp:refs/heads/backup-transfer/$RUN"
          echo "::notice title=transfer::backup-transfer/$RUN"
  cleanup:
    # מוחק ענפי העברה זמניים (backup-transfer/*). בלי סודות.
    if: github.repository == 'shmulikhavivi-design/haim-derech-misparim' && github.ref == 'refs/heads/production-ops/run' && contains(github.event.head_commit.message, '[prod:cleanup]')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: { contents: write }
    steps:
      - name: Delete temporary transfer branches
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for r in $(gh api "repos/${{ github.repository }}/git/matching-refs/heads/backup-transfer/" --jq '.[].ref'); do
            gh api -X DELETE "repos/${{ github.repository }}/git/$r" && echo "::notice title=cleanup::deleted $r"
          done
  repo-secrets:
    # בלי environment — רק סודות ברמת הריפו
    if: github.repository == 'shmulikhavivi-design/haim-derech-misparim' && github.ref == 'refs/heads/production-ops/run' && contains(github.event.head_commit.message, '[prod:secrets]')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Secret names (presence only)
        env:
          NAMES: 'PRODUCTION_DB_URL PROD_DB_URL SUPABASE_DB_URL DATABASE_URL DB_URL SUPABASE_DB_PASSWORD PRODUCTION_DB_PASSWORD PRODUCTION_SUPABASE_TOKEN SUPABASE_ACCESS_TOKEN SUPABASE_TOKEN SUPABASE_PAT SUPABASE_MANAGEMENT_TOKEN SUPABASE_SERVICE_ROLE_KEY SUPABASE_SERVICE_KEY SUPABASE_SECRET_KEY SUPABASE_KEY BREVO_SMTP_KEY BREVO_API_KEY BREVO_KEY SMTP_PASSWORD SMTP_PASS STAGING_DB_URL SUPABASE_STAGING_READ_TOKEN MORNING_CLIENT_ID MORNING_CLIENT_SECRET MORNING_API_KEY MORNING_WEBHOOK_SECRET MORNING_NOTIFY_TOKEN GROW_API_KEY GROW_CLIENT_ID GROW_USER_ID GROW_PAGE_CODE STAGING_FUNCTIONS_TOKEN SENDINBLUE_API_KEY SIB_API_KEY BREVO_API BREVO_TOKEN MAIL_API_KEY EMAIL_API_KEY SMTP_KEY BREVO_SMTP_PASSWORD BREVO_PASSWORD MAIL_FROM'
          PRODUCTION_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_URL: ${{ secrets.DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          PRODUCTION_SUPABASE_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_KEY: ${{ secrets.BREVO_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          SUPABASE_STAGING_READ_TOKEN: ${{ secrets.SUPABASE_STAGING_READ_TOKEN }}
          MORNING_CLIENT_ID: ${{ secrets.MORNING_CLIENT_ID }}
          MORNING_CLIENT_SECRET: ${{ secrets.MORNING_CLIENT_SECRET }}
          MORNING_API_KEY: ${{ secrets.MORNING_API_KEY }}
          MORNING_WEBHOOK_SECRET: ${{ secrets.MORNING_WEBHOOK_SECRET }}
          MORNING_NOTIFY_TOKEN: ${{ secrets.MORNING_NOTIFY_TOKEN }}
          GROW_API_KEY: ${{ secrets.GROW_API_KEY }}
          GROW_CLIENT_ID: ${{ secrets.GROW_CLIENT_ID }}
          GROW_USER_ID: ${{ secrets.GROW_USER_ID }}
          GROW_PAGE_CODE: ${{ secrets.GROW_PAGE_CODE }}
          STAGING_FUNCTIONS_TOKEN: ${{ secrets.STAGING_FUNCTIONS_TOKEN }}
          SENDINBLUE_API_KEY: ${{ secrets.SENDINBLUE_API_KEY }}
          SIB_API_KEY: ${{ secrets.SIB_API_KEY }}
          BREVO_API: ${{ secrets.BREVO_API }}
          BREVO_TOKEN: ${{ secrets.BREVO_TOKEN }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          SMTP_KEY: ${{ secrets.SMTP_KEY }}
          BREVO_SMTP_PASSWORD: ${{ secrets.BREVO_SMTP_PASSWORD }}
          BREVO_PASSWORD: ${{ secrets.BREVO_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: bash scripts/production/secret_names.sh repository
