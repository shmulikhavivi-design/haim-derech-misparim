# Resend → Walla delivery test — Staging ONLY.
# Runs only on push to staging-tests/run with [resend:...] in the commit subject. Mode from commit subject: [resend:diag] — simulated recipients only.
# Does not touch Brevo, Supabase Production, or the live app.
name: Staging Resend Walla test
on:
  push:
    branches: [ 'staging-tests/run' ]
permissions:
  contents: read
jobs:
  resend:
    if: github.repository == 'shmulikhavivi-design/haim-derech-misparim' && contains(github.event.head_commit.message, '[resend:')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run test
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -o pipefail
          python3 scripts/email/resend_walla_test.py | tee out.txt
      - name: Publish result as annotation
        if: always()
        run: |
          python3 -c "import sys;t=open('out.txt').read() if __import__('os').path.exists('out.txt') else 'no output';t=t.replace('%','%25').replace('\r','').replace('\n','%0A');print('::notice title=resend-diag::'+t)"
