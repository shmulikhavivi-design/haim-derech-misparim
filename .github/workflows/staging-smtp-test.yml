# בדיקת שליחת מיילים (Gmail SMTP) — פרויקט Staging בלבד.
# רץ רק ב-push לענף staging-tests/smtp. בלי סודות: רק המפתח הציבורי של Staging (אותו מפתח שנמצא ב-staging.html).
# יוצר משתמש בדיקה אחד ב-Staging בכתובת כינוי של תיבת האפליקציה (+smtp-staging-...), ומבקש עבורו מייל אישור הרשמה ומייל איפוס סיסמה.
# תשובה 200 מ-Supabase = המייל נמסר בהצלחה לשרת של Gmail. שגיאה 500 = ה-SMTP נכשל.
name: Staging SMTP test
on: { push: { branches: [ 'staging-tests/smtp' ] } }
permissions: { contents: read }
concurrency: { group: staging-smtp, cancel-in-progress: false }
jobs:
  smtp:
    if: github.repository == 'shmulikhavivi-design/haim-derech-misparim'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      REF: ousepgdvzammgkxkweze          # Staging בלבד
      PROD: qtspzigjlbtckqfyaubp         # הפרויקט הפעיל — אסור
      KEY: sb_publishable_UXJrkbmi6h3j3Yvaey5Nvw_HIDJOy40
    steps:
      - run: |
          set -u
          case "$REF" in "$PROD") echo "::error::Production ref — stop"; exit 1;; esac
          B="https://$REF.supabase.co/auth/v1"
          H=(-H "apikey: $KEY" -H "Content-Type: application/json")
          note(){ echo "$2"; echo "::notice title=$1::$2"; echo "- **$1:** $2" >> "$GITHUB_STEP_SUMMARY"; }

          S=$(curl -sS -m 20 "${H[@]}" "$B/settings")
          note settings "$(echo "$S" | jq -c '{mailer_autoconfirm, disable_signup, email: .external.email}')"

          EMAIL="life.through.numbers333+smtp-staging-${GITHUB_RUN_ID}@gmail.com"
          PW="T$(openssl rand -hex 12)!a"
          note test-user "$EMAIL"

          # 1) הרשמה — אם Confirm email דלוק, נשלח מייל אישור דרך ה-SMTP
          R=$(curl -sS -m 60 -o /tmp/su.json -w '%{http_code} %{time_total}' "${H[@]}" -X POST "$B/signup" \
                -d "$(jq -nc --arg e "$EMAIL" --arg p "$PW" '{email:$e,password:$p}')")
          T1=${R#* }; R=${R%% *}
          SENT=$(jq -r '(.confirmation_sent_at // .user.confirmation_sent_at // "none")' /tmp/su.json 2>/dev/null)
          MSG=$(jq -r '(.msg // .error_description // .message // "") | tostring' /tmp/su.json 2>/dev/null)
          note signup "HTTP $R | ${T1}s | confirmation_sent_at=$SENT ${MSG:+| $MSG}"

          # 2) קישור כניסה (magic link) לכתובת אחרת — עוד ניסיון שליחה דרך ה-SMTP
          EMAIL2="life.through.numbers333+smtp-otp-${GITHUB_RUN_ID}@gmail.com"
          R2=$(curl -sS -m 60 -o /tmp/otp.json -w '%{http_code} %{time_total}' "${H[@]}" -X POST "$B/otp" \
                -d "$(jq -nc --arg e "$EMAIL2" '{email:$e,create_user:true}')")
          T2=${R2#* }; R2=${R2%% *}
          MSG2=$(jq -r '(.msg // .error_description // .message // "") | tostring' /tmp/otp.json 2>/dev/null)
          note magic-link "HTTP $R2 | ${T2}s ${MSG2:+| $MSG2}"

          # אבחון לפי זמן תגובה: כשל מהיר (<3ש') = Gmail דחה את ההתחברות (בדרך כלל סיסמת אפליקציה/שם משתמש);
          # כשל איטי (>8ש') = לא נוצר חיבור תקין לשרת (Host/Port/הצפנה)
          note timing-hint "$(awk -v t="$T1" 'BEGIN{ if (t<3) print "מהיר — סביר שהבעיה בפרטי ההתחברות"; else if (t>8) print "איטי — סביר שהבעיה בשרת/פורט"; else print "לא חד-משמעי" }')"
          # 3) איפוס סיסמה למשתמש שנוצר בשלב 1 (משתמש קיים => כשל SMTP יחזיר 500). המתנה 65ש' בגלל מגבלת מייל אחד לדקה לכתובת.
          sleep 65
          R3=$(curl -sS -m 60 -o /tmp/rec.json -w '%{http_code} %{time_total}' "${H[@]}" -X POST "$B/recover" \
                -d "$(jq -nc --arg e "$EMAIL" '{email:$e}')")
          T3=${R3#* }; R3=${R3%% *}
          MSG3=$(jq -r '(.msg // .error_description // .message // "") | tostring' /tmp/rec.json 2>/dev/null)
          note password-reset "HTTP $R3 | ${T3}s ${MSG3:+| $MSG3}"
          if [ "$R" = 200 ] && [ "$SENT" != none ] && [ "$R2" = 200 ] && [ "$R3" = 200 ]; then
            note RESULT "✅ SMTP עובד: אישור הרשמה + קישור כניסה + איפוס סיסמה נמסרו לשרת Gmail"
          else echo "::error title=RESULT::❌ שליחת מייל דרך ה-SMTP נכשלה (signup=$R, otp=$R2, recover=$R3)"; exit 1; fi
