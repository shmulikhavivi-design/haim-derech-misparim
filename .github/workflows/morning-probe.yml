# חיים דרך מספרים — בדיקת שמות סודות בלבד (בלי ערכים, בלי חיבור לשום שירות).
# רץ רק ב-push לענף morning-probe/run.
name: Morning probe (read-only)
on: { push: { branches: [ 'morning-probe/run' ] } }
permissions: { contents: read }
concurrency: { group: morning-probe, cancel-in-progress: false }
jobs:
  names:
    if: github.repository == 'shmulikhavivi-design/haim-derech-misparim' && github.ref == 'refs/heads/morning-probe/run'
    strategy: { matrix: { envname: [ production, staging ] } }
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: ${{ matrix.envname }}
    steps:
      - name: Secret names only (values never printed)
        env: { S: '${{ toJSON(secrets) }}' }
        run: |
          N=$(printf '%s' "$S" | jq -r 'keys - ["github_token"] | map(. + "(" + "len" + ")") | join(" ")' 2>/dev/null)
          L=$(printf '%s' "$S" | jq -r 'to_entries | map(select(.key!="github_token")) | map("\(.key)=\(.value|length)") | join(" ")')
          unset S
          echo "::notice title=secret-names-${{ matrix.envname }}::$L"
