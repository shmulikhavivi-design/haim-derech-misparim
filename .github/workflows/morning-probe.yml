# חיים דרך מספרים — בדיקת קיום מפתחות בסביבה production בלבד (בלי ערכים, בלי שינוי בשום מקום).
name: Morning probe (read-only)
on: { push: { branches: [ 'morning-probe/run' ] } }
permissions: { contents: read }
concurrency: { group: morning-probe, cancel-in-progress: false }
jobs:
  probe:
    if: github.repository == 'shmulikhavivi-design/haim-derech-misparim' && github.ref == 'refs/heads/morning-probe/run'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: production
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Presence only
        env:
          NAMES: 'MORNING_CLIENT_ID MORNING_CLIENT_SECRET PRODUCTION_SUPABASE_TOKEN SUPABASE_ACCESS_TOKEN PRODUCTION_DB_URL BREVO_API_KEY BREVO_SMTP_KEY STAGING_FUNCTIONS_TOKEN MORNING_SANDBOX_CLIENT_ID MORNING_SANDBOX_CLIENT_SECRET'
          MORNING_CLIENT_ID: ${{ secrets.MORNING_CLIENT_ID }}
          MORNING_CLIENT_SECRET: ${{ secrets.MORNING_CLIENT_SECRET }}
          PRODUCTION_SUPABASE_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          STAGING_FUNCTIONS_TOKEN: ${{ secrets.STAGING_FUNCTIONS_TOKEN }}
          MORNING_SANDBOX_CLIENT_ID: ${{ secrets.MORNING_SANDBOX_CLIENT_ID }}
          MORNING_SANDBOX_CLIENT_SECRET: ${{ secrets.MORNING_SANDBOX_CLIENT_SECRET }}
        run: bash scripts/production/secret_names.sh production
