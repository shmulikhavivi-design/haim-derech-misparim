# חיים דרך מספרים — בדיקות SQL על פרויקט Staging בלבד
#
# הרצה ידנית בלבד. אין הרצה בפתיחת PR, ב-push לענפים רגילים או לפי שעון.
# שתי דרכים להפעיל:
#   1. push לענף הייעודי staging-tests/run. המצב נקבע לפי שורת הנושא של ה-commit: [staging:check] / [staging:install03] /
#      [staging:install04] / [staging:install05] / [staging:tests02] / [staging:e2e]. בלי סימון = check (קריאה בלבד).
#   2. כפתור "Run workflow" (יופיע רק אם הקובץ יגיע ל-main בעתיד, באישור).
#
# במצב e2e נדרש גם המשתנה (לא סוד) STAGING_PUBLISHABLE_KEY בסביבה staging — המפתח הציבורי של Staging.
# הסוד היחיד: STAGING_DB_URL — Environment Secret בסביבת GitHub בשם "staging" (לא Repository Secret).
# כתובת חיבור למסד של פרויקט Staging בלבד. לא נשמרת בקוד ולא מודפסת; הסיסמה מוסתרת (add-mask) גם אם תופיע בשגיאה.
# ההגנות עצמן (מזהה פרויקט, hdm_staging_marker, קריאה בלבד כברירת מחדל) נמצאות ב-scripts/staging_db/run.sh.

name: Staging DB tests (manual)

on:
  push:
    branches: [ 'staging-tests/run' ]
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = קריאה בלבד; install03 / install04 / tests02 = רק אחרי אישור'
        required: true
        default: 'check'
        type: choice
        options: [ check, install03, install04, install05, tests02, e2e, smtp, smtpfix, authflow, advisors, sslfix, install06, tests07, install08, tests09, install10, tests11, e2eadmin, audit, install12, tests13, mailnet, hookwire, authcfg, perms, install14, tests15, install16, install17, tests18, e2ebilling, install19, tests20, install21, tests22, install23, install24, tests25, install26, tests27, growsecrets, e2egrow, e2ecancellive, e2esignup, e2esignupreal, e2edesign ]

permissions:
  contents: read

concurrency:
  group: staging-db
  cancel-in-progress: false

jobs:
  staging-db:
    # רק מהריפו הזה ורק מהענף הייעודי / כפתור ידני
    if: github.repository == 'shmulikhavivi-design/haim-derech-misparim' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/staging-tests/run')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # הסוד נלקח מסביבת GitHub "staging" בלבד
    environment: staging
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Choose mode
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          mode="${INPUT_MODE:-}"
          if [ -z "$mode" ]; then
            mode=$(printf '%s\n' "$COMMIT_MSG" | head -n1 | sed -n 's/.*\[staging:\([a-z0-9]*\)\].*/\1/p')
          fi
          mode="${mode:-check}"
          case "$mode" in check|install03|install04|install05|tests02|e2e|smtp|smtpfix|authflow|advisors|sslfix|install06|tests07|install08|tests09|install10|tests11|e2eadmin|audit|install12|tests13|mailnet|hookwire|authcfg|perms|install14|tests15|install16|install17|tests18|e2ebilling|install19|tests20|install21|tests22|install23|install24|tests25|install26|tests27|growsecrets|e2egrow|e2ecancellive|e2esignup|e2esignupreal|e2edesign) ;; *) echo "מצב לא מוכר: $mode"; exit 1;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "### מצב ההרצה: \`$mode\`" >> "$GITHUB_STEP_SUMMARY"

      - name: psql
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)

      - uses: actions/setup-python@v6
        if: steps.mode.outputs.mode == 'e2e' || steps.mode.outputs.mode == 'e2ebilling' || steps.mode.outputs.mode == 'e2ecancellive' || steps.mode.outputs.mode == 'e2esignup' || steps.mode.outputs.mode == 'e2esignupreal' || steps.mode.outputs.mode == 'e2eadmin' || steps.mode.outputs.mode == 'e2edesign'
        with:
          python-version: '3.12'

      - name: Browser (e2e only)
        if: steps.mode.outputs.mode == 'e2e' || steps.mode.outputs.mode == 'e2ebilling' || steps.mode.outputs.mode == 'e2ecancellive' || steps.mode.outputs.mode == 'e2esignup' || steps.mode.outputs.mode == 'e2esignupreal' || steps.mode.outputs.mode == 'e2eadmin' || steps.mode.outputs.mode == 'e2edesign'
        run: |
          python3 -m pip install --quiet playwright==1.55.0 pillow
          python3 -m playwright install --with-deps chromium webkit

      # ---- e2egrow בלבד: פריסת פונקציות Grow ל-Staging (רק לפרויקט Staging) עם סודות חד-פעמיים לבדיקה ----
      - name: Grow e2e — setup CLI
        if: steps.mode.outputs.mode == 'e2egrow'
        uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Grow e2e — deploy to Staging (mock Grow, no charges)
        if: steps.mode.outputs.mode == 'e2egrow'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          REF=ousepgdvzammgkxkweze
          [ "$REF" != "qtspzigjlbtckqfyaubp" ] || exit 1
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error title=e2egrow::חסר SUPABASE_ACCESS_TOKEN בסביבה staging"; exit 1; }
          WT=$(openssl rand -hex 32); CS=$(openssl rand -hex 32); MS=$(openssl rand -hex 32); UID_=mock-user-$(openssl rand -hex 4)
          for v in "$WT" "$CS" "$MS"; do echo "::add-mask::$v"; done
          echo "GROW_WEBHOOK_TOKEN=$WT" >> "$GITHUB_ENV"; echo "HDM_CRON_SECRET=$CS" >> "$GITHUB_ENV"
          umask 077; F=$(mktemp)
          cat > "$F" <<EOT
          HDM_ENV=staging
          GROW_MOCK=1
          GROW_LIVE=1
          GROW_API_BASE=https://$REF.supabase.co/functions/v1/grow-mock
          GROW_USER_ID=$UID_
          GROW_PAGE_CODE=mock-page
          GROW_WEBHOOK_TOKEN=$WT
          HDM_CRON_SECRET=$CS
          GROW_MOCK_SECRET=$MS
          HDM_APP_URL=https://shmulikhavivi-design.github.io/haim-derech-misparim
          EOT
          sed -i 's/^ *//' "$F"
          supabase secrets set --project-ref "$REF" --env-file "$F" >/dev/null
          rm -f "$F"
          supabase functions deploy grow-checkout grow-webhook grow-renewals grow-mock --project-ref "$REF" --use-api --no-verify-jwt 2>&1 | grep -vE 'eyJ|sb_secret' | tail -n 15
      - name: Run on Staging
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          STAGING_PUBLISHABLE_KEY: ${{ vars.STAGING_PUBLISHABLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RUN_MODE: ${{ steps.mode.outputs.mode }}
          SUPABASE_STAGING_READ_TOKEN: ${{ secrets.SUPABASE_STAGING_READ_TOKEN }}
          GROW_WEBHOOK_TOKEN: ${{ env.GROW_WEBHOOK_TOKEN }}
          HDM_CRON_SECRET: ${{ env.HDM_CRON_SECRET }}
          # סודות Grow — מועברים רק לבדיקת קיום (growsecrets); הסקריפט לא מדפיס ערכים
          GROW_USER_ID: ${{ steps.mode.outputs.mode == 'growsecrets' && secrets.GROW_USER_ID || '' }}
          GROW_PAGE_CODE: ${{ steps.mode.outputs.mode == 'growsecrets' && secrets.GROW_PAGE_CODE || '' }}
          GROW_API_KEY: ${{ steps.mode.outputs.mode == 'growsecrets' && secrets.GROW_API_KEY || '' }}
          GROW_CLIENT_ID: ${{ steps.mode.outputs.mode == 'growsecrets' && secrets.GROW_CLIENT_ID || '' }}
          GROW_SANDBOX_USER_ID: ${{ steps.mode.outputs.mode == 'growsecrets' && secrets.GROW_SANDBOX_USER_ID || '' }}
          GROW_SANDBOX_PAGE_CODE: ${{ steps.mode.outputs.mode == 'growsecrets' && secrets.GROW_SANDBOX_PAGE_CODE || '' }}
          GROW_SANDBOX_API_KEY: ${{ steps.mode.outputs.mode == 'growsecrets' && secrets.GROW_SANDBOX_API_KEY || '' }}
        run: bash scripts/staging_db/run.sh "$RUN_MODE"

      - name: Grow e2e — switch functions off (always)
        if: always() && steps.mode.outputs.mode == 'e2egrow'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          REF=ousepgdvzammgkxkweze
          supabase secrets set --project-ref "$REF" GROW_LIVE=0 GROW_MOCK=0 HDM_ENV=staging GROW_API_BASE=https://sandbox.meshulam.co.il/api/light/server/1.0 \
            GROW_WEBHOOK_TOKEN=$(openssl rand -hex 32) HDM_CRON_SECRET=$(openssl rand -hex 32) GROW_MOCK_SECRET=$(openssl rand -hex 32) >/dev/null \
            && echo "::notice title=e2egrow-off::הפונקציות ב-Staging כבויות: GROW_LIVE=0, GROW_MOCK=0, סודות הבדיקה הוחלפו" \
            || echo "::error title=e2egrow-off::כיבוי נכשל — יש לבדוק ידנית"
      - name: Screenshots (e2e only)
        if: always() && (steps.mode.outputs.mode == 'e2e' || steps.mode.outputs.mode == 'e2eadmin' || steps.mode.outputs.mode == 'e2edesign')
        uses: actions/upload-artifact@v5
        with:
          name: e2e-screenshots
          path: /tmp/hdm-shots
          if-no-files-found: ignore
          retention-days: 7

  # צילומי המסך של העיצוב: נשמרים בענף staging-tests/screens. ג'וב נפרד — בלי סביבת staging ובלי סודות.
  publish-design-shots:
    needs: staging-db
    if: always() && needs.staging-db.outputs.mode == 'e2edesign'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: e2e-screenshots
          path: shots
      - name: Push screenshots to staging-tests/screens
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          ls -la shots
          cd shots
          git init -q -b staging-tests/screens
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "design screenshots from $SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:staging-tests/screens
