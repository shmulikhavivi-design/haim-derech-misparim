# חיים דרך מספרים — בדיקות SQL על פרויקט Staging בלבד
#
# הרצה ידנית בלבד. אין הרצה בפתיחת PR, ב-push לענפים רגילים או לפי שעון.
# שתי דרכים להפעיל:
#   1. push לענף הייעודי staging-tests/run. המצב נקבע לפי שורת הנושא של ה-commit: [staging:check] / [staging:install03] /
#      [staging:install04] / [staging:install05] / [staging:tests02] / [staging:e2e]. בלי סימון = check (קריאה בלבד).
#   2. כפתור "Run workflow" (יופיע רק אם הקובץ יגיע ל-main בעתיד, באישור).
#
# במצב e2e נדרש גם המשתנה (לא סוד) STAGING_PUBLISHABLE_KEY בסביבה staging — המפתח הציבורי של Staging.
# הסוד היחיד: STAGING_DB_URL — Environment Secret בסביבת GitHub בשם "staging" (לא Repository Secret).
# כתובת חיבור למסד של פרויקט Staging בלבד. לא נשמרת בקוד ולא מודפסת; הסיסמה מוסתרת (add-mask) גם אם תופיע בשגיאה.
# ההגנות עצמן (מזהה פרויקט, hdm_staging_marker, קריאה בלבד כברירת מחדל) נמצאות ב-scripts/staging_db/run.sh.

name: Staging DB tests (manual)

on:
  push:
    branches: [ 'staging-tests/run' ]
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = קריאה בלבד; install03 / install04 / tests02 = רק אחרי אישור'
        required: true
        default: 'check'
        type: choice
        options: [ check, install03, install04, install05, tests02, e2e, smtp, smtpfix, authflow, advisors, sslfix, install06, tests07, install08, tests09, install10, tests11, e2eadmin, audit, install12, tests13, mailnet, hookwire, authcfg, perms, install14, tests15, install16, install17, tests18, e2ebilling, install19, tests20, e2esignup ]

permissions:
  contents: read

concurrency:
  group: staging-db
  cancel-in-progress: false

jobs:
  staging-db:
    # רק מהריפו הזה ורק מהענף הייעודי / כפתור ידני
    if: github.repository == 'shmulikhavivi-design/haim-derech-misparim' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/staging-tests/run')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # הסוד נלקח מסביבת GitHub "staging" בלבד
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Choose mode
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          mode="${INPUT_MODE:-}"
          if [ -z "$mode" ]; then
            mode=$(printf '%s\n' "$COMMIT_MSG" | head -n1 | sed -n 's/.*\[staging:\([a-z0-9]*\)\].*/\1/p')
          fi
          mode="${mode:-check}"
          case "$mode" in check|install03|install04|install05|tests02|e2e|smtp|smtpfix|authflow|advisors|sslfix|install06|tests07|install08|tests09|install10|tests11|e2eadmin|audit|install12|tests13|mailnet|hookwire|authcfg|perms|install14|tests15|install16|install17|tests18|e2ebilling|install19|tests20|e2esignup) ;; *) echo "מצב לא מוכר: $mode"; exit 1;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "### מצב ההרצה: \`$mode\`" >> "$GITHUB_STEP_SUMMARY"

      - name: psql
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)

      - uses: actions/setup-python@v6
        if: steps.mode.outputs.mode == 'e2e' || steps.mode.outputs.mode == 'e2ebilling' || steps.mode.outputs.mode == 'e2esignup' || steps.mode.outputs.mode == 'e2eadmin'
        with:
          python-version: '3.12'

      - name: Browser (e2e only)
        if: steps.mode.outputs.mode == 'e2e' || steps.mode.outputs.mode == 'e2ebilling' || steps.mode.outputs.mode == 'e2esignup' || steps.mode.outputs.mode == 'e2eadmin'
        run: |
          python3 -m pip install --quiet playwright==1.55.0
          python3 -m playwright install --with-deps chromium webkit

      - name: Run on Staging
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          STAGING_PUBLISHABLE_KEY: ${{ vars.STAGING_PUBLISHABLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RUN_MODE: ${{ steps.mode.outputs.mode }}
          SUPABASE_STAGING_READ_TOKEN: ${{ secrets.SUPABASE_STAGING_READ_TOKEN }}
        run: bash scripts/staging_db/run.sh "$RUN_MODE"

      - name: Screenshots (e2e only)
        if: always() && (steps.mode.outputs.mode == 'e2e' || steps.mode.outputs.mode == 'e2eadmin')
        uses: actions/upload-artifact@v5
        with:
          name: e2e-screenshots
          path: /tmp/hdm-shots
          if-no-files-found: ignore
          retention-days: 7
