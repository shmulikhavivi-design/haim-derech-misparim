# חיים דרך מספרים — בדיקות SQL על פרויקט Staging בלבד
#
# הרצה ידנית בלבד. אין הרצה בפתיחת PR, ב-push לענפים רגילים או לפי שעון.
# שתי דרכים להפעיל:
#   1. push לענף הייעודי staging-tests/run. המצב נקבע לפי שורת הנושא של ה-commit: [staging:check] / [staging:install03] /
#      [staging:install04] / [staging:install05] / [staging:tests02] / [staging:e2e]. בלי סימון = check (קריאה בלבד).
#   2. כפתור "Run workflow" (יופיע רק אם הקובץ יגיע ל-main בעתיד, באישור).
#
# במצב e2e נדרש גם המשתנה (לא סוד) STAGING_PUBLISHABLE_KEY בסביבה staging — המפתח הציבורי של Staging.
# הסוד היחיד: STAGING_DB_URL — Environment Secret בסביבת GitHub בשם "staging" (לא Repository Secret).
# כתובת חיבור למסד של פרויקט Staging בלבד. לא נשמרת בקוד ולא מודפסת; הסיסמה מוסתרת (add-mask) גם אם תופיע בשגיאה.
# ההגנות עצמן (מזהה פרויקט, hdm_staging_marker, קריאה בלבד כברירת מחדל) נמצאות ב-scripts/staging_db/run.sh.

name: Staging DB tests (manual)

on:
  push:
    branches: [ 'staging-tests/run' ]
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = קריאה בלבד; install03 / install04 / tests02 = רק אחרי אישור'
        required: true
        default: 'check'
        type: choice
        options: [ check, install03, install04, install05, tests02, e2e, smtp, smtpfix, authflow, advisors, sslfix, install06, tests07, install08, tests09, install10, tests11, e2eadmin, audit, install12, tests13, mailnet, hookwire, authcfg, perms, install14, tests15, install16, install17, tests18, e2ebilling, install19, tests20, install21, tests22, install23, install24, tests25, install26, tests27, install28, tests29, growsecrets, e2egrow, e2emco, e2eflow, growperms, keynames, e2emorning, vaultnames, e2ecancellive, e2esignup, e2esignupreal, e2edesign ]

permissions:
  contents: read

concurrency:
  group: staging-db
  cancel-in-progress: false

jobs:
  staging-db:
    # רק מהריפו הזה ורק מהענף הייעודי / כפתור ידני
    if: github.repository == 'shmulikhavivi-design/haim-derech-misparim' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/staging-tests/run')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # הסוד נלקח מסביבת GitHub "staging" בלבד
    environment: staging
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Choose mode
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          mode="${INPUT_MODE:-}"
          if [ -z "$mode" ]; then
            mode=$(printf '%s\n' "$COMMIT_MSG" | head -n1 | sed -n 's/.*\[staging:\([a-z0-9]*\)\].*/\1/p')
          fi
          mode="${mode:-check}"
          case "$mode" in e2etargetmarknew|install49|tests50|e2etargetmail|defdump|defhash|e2elivetwo|e2ecombo|install47|tests48|e2epay|e2eage|e2elivefinal|e2enoempty|e2eautoupdate|e2elivecode|e2etargetmark|install45|tests46|e2efreelevel|e2egolive|install43|tests44|install42|install40|tests41|install38|tests39|e2eadminpanel|e2excdev|install36|tests37|e2eworker|install34|tests35|e2ealerts|install32|tests33|e2ecard|install30|tests31|e2evip|keynames|e2emorning|check|install03|install04|install05|tests02|e2e|smtp|smtpfix|authflow|advisors|sslfix|install06|tests07|install08|tests09|install10|tests11|e2eadmin|audit|install12|tests13|mailnet|hookwire|authcfg|perms|install14|tests15|install16|install17|tests18|e2ebilling|install19|tests20|install21|tests22|install23|install24|tests25|install26|tests27|install28|tests29|growsecrets|e2egrow|e2emco|e2eflow|growperms|vaultnames|e2ecancellive|e2esignup|e2esignupreal|e2edesign) ;; *) echo "מצב לא מוכר: $mode"; exit 1;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "### מצב ההרצה: \`$mode\`" >> "$GITHUB_STEP_SUMMARY"

      - name: psql
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)

      - uses: actions/setup-python@v6
        if: steps.mode.outputs.mode == 'e2elivetwo' || steps.mode.outputs.mode == 'e2ecombo' || steps.mode.outputs.mode == 'e2epay' || steps.mode.outputs.mode == 'e2eage' || steps.mode.outputs.mode == 'e2e' || steps.mode.outputs.mode == 'e2efreelevel' || steps.mode.outputs.mode == 'e2etargetmark' || steps.mode.outputs.mode == 'e2etargetmail' || steps.mode.outputs.mode == 'e2etargetmarknew' || steps.mode.outputs.mode == 'e2elivecode' || steps.mode.outputs.mode == 'e2eautoupdate' || steps.mode.outputs.mode == 'e2enoempty' || steps.mode.outputs.mode == 'e2elivefinal' || steps.mode.outputs.mode == 'e2egolive' || steps.mode.outputs.mode == 'e2excdev' || steps.mode.outputs.mode == 'e2eadminpanel' || steps.mode.outputs.mode == 'e2ealerts' || steps.mode.outputs.mode == 'e2ecard' || steps.mode.outputs.mode == 'e2evip' || steps.mode.outputs.mode == 'e2ebilling' || steps.mode.outputs.mode == 'e2ecancellive' || steps.mode.outputs.mode == 'e2esignup' || steps.mode.outputs.mode == 'e2esignupreal' || steps.mode.outputs.mode == 'e2eadmin' || steps.mode.outputs.mode == 'e2edesign' || steps.mode.outputs.mode == 'e2emco'
        with:
          python-version: '3.12'

      - name: Browser (e2e only)
        if: steps.mode.outputs.mode == 'e2elivetwo' || steps.mode.outputs.mode == 'e2ecombo' || steps.mode.outputs.mode == 'e2epay' || steps.mode.outputs.mode == 'e2eage' || steps.mode.outputs.mode == 'e2e' || steps.mode.outputs.mode == 'e2efreelevel' || steps.mode.outputs.mode == 'e2etargetmark' || steps.mode.outputs.mode == 'e2etargetmail' || steps.mode.outputs.mode == 'e2etargetmarknew' || steps.mode.outputs.mode == 'e2elivecode' || steps.mode.outputs.mode == 'e2eautoupdate' || steps.mode.outputs.mode == 'e2enoempty' || steps.mode.outputs.mode == 'e2elivefinal' || steps.mode.outputs.mode == 'e2egolive' || steps.mode.outputs.mode == 'e2excdev' || steps.mode.outputs.mode == 'e2eadminpanel' || steps.mode.outputs.mode == 'e2ealerts' || steps.mode.outputs.mode == 'e2ecard' || steps.mode.outputs.mode == 'e2evip' || steps.mode.outputs.mode == 'e2ebilling' || steps.mode.outputs.mode == 'e2ecancellive' || steps.mode.outputs.mode == 'e2esignup' || steps.mode.outputs.mode == 'e2esignupreal' || steps.mode.outputs.mode == 'e2eadmin' || steps.mode.outputs.mode == 'e2edesign' || steps.mode.outputs.mode == 'e2emco'
        run: |
          python3 -m pip install --quiet playwright==1.55.0 pillow
          timeout 360 python3 -m playwright install --with-deps chromium || timeout 300 python3 -m playwright install chromium
          timeout 150 python3 -m playwright install --with-deps webkit || echo "::warning title=webkit::התקנת ספארי (WebKit) לא הסתיימה בזמן — הבדיקה תרוץ ב-Chrome בלבד"

      # ---- e2egrow בלבד: פריסת פונקציות Grow ל-Staging (רק לפרויקט Staging) עם סודות חד-פעמיים לבדיקה ----
      - name: Grow e2e — setup CLI
        if: steps.mode.outputs.mode == 'e2egrow'
        uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Grow e2e — deploy to Staging (mock Grow, no charges)
        if: steps.mode.outputs.mode == 'e2egrow'
        env:
          # טוקן נפרד ומוגבל לפריסת פונקציות Staging בלבד; אם לא קיים — הטוקן הכללי של Staging
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_FUNCTIONS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          REF=ousepgdvzammgkxkweze
          [ "$REF" != "qtspzigjlbtckqfyaubp" ] || exit 1
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error title=e2egrow::חסר SUPABASE_ACCESS_TOKEN בסביבה staging"; exit 1; }
          WT=$(openssl rand -hex 32); CS=$(openssl rand -hex 32); MS=$(openssl rand -hex 32); UID_=mock-user-$(openssl rand -hex 4)
          for v in "$WT" "$CS" "$MS"; do echo "::add-mask::$v"; done
          echo "GROW_WEBHOOK_TOKEN=$WT" >> "$GITHUB_ENV"; echo "HDM_CRON_SECRET=$CS" >> "$GITHUB_ENV"
          umask 077; F=$(mktemp)
          cat > "$F" <<EOT
          HDM_ENV=staging
          GROW_MOCK=1
          GROW_LIVE=1
          GROW_API_BASE=https://$REF.supabase.co/functions/v1/grow-mock
          GROW_USER_ID=$UID_
          GROW_PAGE_CODE=mock-page
          GROW_WEBHOOK_TOKEN=$WT
          HDM_CRON_SECRET=$CS
          GROW_MOCK_SECRET=$MS
          HDM_APP_URL=https://shmulikhavivi-design.github.io/haim-derech-misparim
          EOT
          sed -i 's/^ *//' "$F"
          report(){ printf '::error title=e2egrow-%s::%s\n' "$1" "$(printf '%s' "$2" | grep -vE 'eyJ|sb_secret' | tail -n 8 | tr '\n' ' ' | cut -c1-600)"; }
          OUT=$(supabase secrets set --project-ref "$REF" --env-file "$F" 2>&1) || { rm -f "$F"; report secrets "$OUT"; exit 1; }
          rm -f "$F"
          OUT=$(supabase functions deploy grow-checkout grow-webhook grow-renewals grow-mock --project-ref "$REF" --use-api --no-verify-jwt 2>&1) || { report deploy "$OUT"; exit 1; }
          echo "::notice title=e2egrow-deploy::$(printf '%s' "$OUT" | grep -iE 'deployed|function' | tail -n 6 | tr '\n' ' ' | cut -c1-500)"
      # ---- e2emorning: פריסת פונקציות Morning ל-Staging (הסליקה כבויה) + בדיקות כניסה + Sandbox של Morning אם יש מפתחות ----
      - name: Morning e2e — setup CLI
        if: contains(fromJSON('["e2emorning","e2eflow","e2eworker","e2epay","e2etargetmail"]'), steps.mode.outputs.mode)
        uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Morning e2e — deploy to Staging (charging off)
        if: contains(fromJSON('["e2emorning","e2eflow","e2epay"]'), steps.mode.outputs.mode)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_FUNCTIONS_TOKEN }}
          SBX_ID: ${{ steps.mode.outputs.mode == 'e2emorning' && secrets.MORNING_SANDBOX_CLIENT_ID || '' }}
          SBX_SECRET: ${{ steps.mode.outputs.mode == 'e2emorning' && secrets.MORNING_SANDBOX_CLIENT_SECRET || '' }}
        run: |
          set -euo pipefail
          REF=ousepgdvzammgkxkweze
          [ "$REF" != "qtspzigjlbtckqfyaubp" ] || exit 1
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error title=e2emorning::חסר STAGING_FUNCTIONS_TOKEN בסביבה staging"; exit 1; }
          WT=$(openssl rand -hex 32); CS=$(openssl rand -hex 32); WS=$(openssl rand -hex 32)
          for v in "$WT" "$CS" "$WS"; do echo "::add-mask::$v"; done
          echo "MORNING_WEBHOOK_SECRET=$WS" >> "$GITHUB_ENV"
          [ -n "$SBX_SECRET" ] && echo "::add-mask::$SBX_SECRET"
          echo "MORNING_WEBHOOK_TOKEN=$WT" >> "$GITHUB_ENV"; echo "HDM_CRON_SECRET=$CS" >> "$GITHUB_ENV"
          umask 077; F=$(mktemp)
          {
            echo "HDM_ENV=staging"
            echo "MORNING_LIVE=0"
            echo "MORNING_API_BASE=https://sandbox.d.greeninvoice.co.il/api/v1"
            echo "MORNING_WEBHOOK_TOKEN=$WT"
            echo "MORNING_WEBHOOK_SECRET=$WS"
            echo "HDM_CRON_SECRET=$CS"
            echo "HDM_APP_URL=https://haim-derech-misparim.pages.dev"
            # שלב בדיקה: רק המשתמש ברשימה יכול לשלם (מזהה אקראי — אף משתמש אמיתי לא ברשימה)
            echo "HDM_BILLING_ALLOWED_USERS=$(cat /proc/sys/kernel/random/uuid)"
            # רק מפתחות Sandbox נכנסים ל-Staging. מפתחות ה-Production של Morning לא מועברים לכאן בכלל.
            if [ -n "$SBX_ID" ] && [ -n "$SBX_SECRET" ]; then echo "MORNING_CLIENT_ID=$SBX_ID"; echo "MORNING_CLIENT_SECRET=$SBX_SECRET"; fi
          } > "$F"
          report(){ printf '::error title=e2emorning-%s::%s\n' "$1" "$(printf '%s' "$2" | grep -vE 'eyJ|sb_secret|sbp_' | tail -n 8 | tr '\n' ' ' | cut -c1-600)"; }
          OUT=$(supabase secrets set --project-ref "$REF" --env-file "$F" 2>&1) || { rm -f "$F"; report secrets "$OUT"; exit 1; }
          rm -f "$F"
          FNS="morning-checkout morning-webhook morning-renewals"; [ "${{ steps.mode.outputs.mode }}" = e2epay ] && FNS="$FNS hdm-billing-worker"
          OUT=$(supabase functions deploy $FNS --project-ref "$REF" --use-api --no-verify-jwt 2>&1) || { report deploy "$OUT"; exit 1; }
          echo "::notice title=e2emorning-deploy::$(printf '%s' "$OUT" | grep -iE 'deployed|function' | tail -n 6 | tr '\n' ' ' | cut -c1-500)"
          sleep 5
      # ---- e2eworker: פונקציית מיילי הביטול ב-Staging עם מפתח Brevo לא תקף בכוונה (שום מייל לא נשלח) ----
      - name: Worker e2e — deploy to Staging (invalid Brevo key on purpose)
        if: steps.mode.outputs.mode == 'e2eworker'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_FUNCTIONS_TOKEN }}
        run: |
          set -euo pipefail
          REF=ousepgdvzammgkxkweze
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error title=e2eworker::חסר STAGING_FUNCTIONS_TOKEN"; exit 1; }
          CS=$(openssl rand -hex 32); echo "::add-mask::$CS"; echo "HDM_CRON_SECRET=$CS" >> "$GITHUB_ENV"
          umask 077; F=$(mktemp)
          { echo "HDM_CRON_SECRET=$CS"; echo "BREVO_API_KEY=xkeysib-invalid-$(openssl rand -hex 16)"; echo "MAIL_FROM=noreply@example.invalid"; echo "DRY_RUN=0"; } > "$F"
          OUT=$(supabase secrets set --project-ref "$REF" --env-file "$F" 2>&1) || { rm -f "$F"; echo "::error title=e2eworker-secrets::$(echo "$OUT" | grep -vE 'sbp_|eyJ' | tail -3 | tr '\n' ' ')"; exit 1; }
          rm -f "$F"
          OUT=$(supabase functions deploy hdm-billing-worker --project-ref "$REF" --use-api --no-verify-jwt 2>&1) || { echo "::error title=e2eworker-deploy::$(echo "$OUT" | grep -vE 'sbp_|eyJ' | tail -6 | tr '\n' ' ')"; exit 1; }
          echo "::notice title=e2eworker-deploy::$(echo "$OUT" | grep -iE 'deployed' | tail -2 | tr '\n' ' ')"
          sleep 8
      # ---- e2etargetmail: פונקציית התראות 🎯 ב-Staging עם מפתח Brevo לא תקף בכוונה (שום מייל לא נשלח) + בדיקות יחידה ----
      - uses: denoland/setup-deno@v2
        if: steps.mode.outputs.mode == 'e2etargetmail'
        with: { deno-version: v2.x }
      - name: Target mail — unit tests (Deno, no network)
        if: steps.mode.outputs.mode == 'e2etargetmail'
        run: |
          UO=$(deno test --no-check supabase/functions/_shared/target_mailer_test.ts supabase/functions/_shared/email_worker_test.ts 2>&1); URC=$?
          echo "$UO" | tail -n 40
          echo "::notice title=targetmail-unit::$(echo "$UO" | sed 's/\x1b\[[0-9;]*m//g' | grep -E 'passed|failed|FAILED' | tail -n 4 | tr '\n' ' ')"
          exit $URC
      - name: Target mail — deploy to Staging (invalid Brevo key on purpose)
        if: steps.mode.outputs.mode == 'e2etargetmail'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_FUNCTIONS_TOKEN }}
        run: |
          set -euo pipefail
          REF=ousepgdvzammgkxkweze
          [ "$REF" != "qtspzigjlbtckqfyaubp" ] || exit 1
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error title=e2etargetmail::חסר STAGING_FUNCTIONS_TOKEN"; exit 1; }
          CS=$(openssl rand -hex 32); echo "::add-mask::$CS"; echo "HDM_CRON_SECRET=$CS" >> "$GITHUB_ENV"
          umask 077; F=$(mktemp)
          { echo "HDM_CRON_SECRET=$CS"; echo "BREVO_API_KEY=xkeysib-invalid-$(openssl rand -hex 16)"; echo "MAIL_FROM=noreply@example.invalid"; echo "DRY_RUN=0"; echo "TARGET_EMAILS_LIVE=1"; } > "$F"
          OUT=$(supabase secrets set --project-ref "$REF" --env-file "$F" 2>&1) || { rm -f "$F"; echo "::error title=e2etargetmail-secrets::$(echo "$OUT" | grep -vE 'sbp_|eyJ' | tail -3 | tr '\n' ' ')"; exit 1; }
          rm -f "$F"
          OUT=$(supabase functions deploy hdm-target-mailer --project-ref "$REF" --use-api --no-verify-jwt 2>&1) || { echo "::error title=e2etargetmail-deploy::$(echo "$OUT" | grep -vE 'sbp_|eyJ' | tail -6 | tr '\n' ' ')"; exit 1; }
          echo "::notice title=e2etargetmail-deploy::$(echo "$OUT" | grep -iE 'deployed' | tail -2 | tr '\n' ' ')"
          sleep 8
      - uses: denoland/setup-deno@v2
        if: steps.mode.outputs.mode == 'e2emorning'
        with: { deno-version: v2.x }
      - name: Morning e2e — unit tests + Staging guards + Sandbox
        if: steps.mode.outputs.mode == 'e2emorning'
        env:
          MORNING_SANDBOX_CLIENT_ID: ${{ steps.mode.outputs.mode == 'e2emorning' && secrets.MORNING_SANDBOX_CLIENT_ID || '' }}
          MORNING_SANDBOX_CLIENT_SECRET: ${{ steps.mode.outputs.mode == 'e2emorning' && secrets.MORNING_SANDBOX_CLIENT_SECRET || '' }}
        run: |
          [ -n "$MORNING_SANDBOX_CLIENT_SECRET" ] && echo "::add-mask::$MORNING_SANDBOX_CLIENT_SECRET"
          UO=$(deno test --no-check supabase/functions/_shared/morning_test.ts 2>&1); URC=$?
          echo "$UO" | tail -n 40
          echo "::notice title=e2emorning-unit::$(echo "$UO" | sed 's/\x1b\[[0-9;]*m//g' | grep -E 'passed|failed|FAILED|=>' | tail -n 8 | tr '\n' ' ')"
          deno run --allow-net --allow-env --allow-write scripts/morning/sandbox_e2e.ts; RC=$?
          [ "$URC" = 0 ] && [ "$RC" = 0 ]
      - name: Key names (presence only)
        if: steps.mode.outputs.mode == 'keynames'
        env:
          K1: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANDBOX_CLIENT_ID || '' }}
          K2: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANDBOX_CLIENT_SECRET || '' }}
          K3: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANDBOX_API_KEY || '' }}
          K4: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANDBOX_SECRET || '' }}
          K5: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANDBOX_ID || '' }}
          K6: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANDBOX_KEY || '' }}
          K7: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANDBOX_API_SECRET || '' }}
          K8: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANDBOX_API_ID || '' }}
          K9: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANDBOX_CLIENTID || '' }}
          K10: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANDBOX_CLIENT || '' }}
          K11: ${{ steps.mode.outputs.mode == 'keynames' && secrets.SANDBOX_CLIENT_ID || '' }}
          K12: ${{ steps.mode.outputs.mode == 'keynames' && secrets.SANDBOX_CLIENT_SECRET || '' }}
          K13: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANBOX_CLIENT_ID || '' }}
          K14: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANBOX_CLIENT_SECRET || '' }}
          K15: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANDBOX_CLIENT_SECERT || '' }}
          K16: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANDBOX_CLIENT_SECRETS || '' }}
          K17: ${{ steps.mode.outputs.mode == 'keynames' && secrets.GREENINVOICE_SANDBOX_CLIENT_ID || '' }}
          K18: ${{ steps.mode.outputs.mode == 'keynames' && secrets.GREEN_INVOICE_SANDBOX_CLIENT_ID || '' }}
          K19: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANDBOX_CLIEN_ID || '' }}
          K20: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANDBOX_CLINET_ID || '' }}
          K21: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANDBOX_CLIENT_ID1 || '' }}
          K22: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANDBOX || '' }}
          K23: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANDBOX_TOKEN || '' }}
          K24: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_TEST_CLIENT_ID || '' }}
          K25: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_TEST_CLIENT_SECRET || '' }}
          K26: ${{ steps.mode.outputs.mode == 'keynames' && secrets.SANDBOX_MORNING_CLIENT_ID || '' }}
          K27: ${{ steps.mode.outputs.mode == 'keynames' && secrets.SANDBOX_MORNING_CLIENT_SECRET || '' }}
          K28: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANDBOX_CLIENT_ID_STAGING || '' }}
          K29: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANDBOX_CLIENT_SECRET_STAGING || '' }}
          K30: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_DEV_CLIENT_ID || '' }}
          K31: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_DEV_CLIENT_SECRET || '' }}
          K32: ${{ steps.mode.outputs.mode == 'keynames' && secrets.GREENINVOICE_SANDBOX_API_ID || '' }}
          K33: ${{ steps.mode.outputs.mode == 'keynames' && secrets.GREENINVOICE_SANDBOX_API_SECRET || '' }}
          K34: ${{ steps.mode.outputs.mode == 'keynames' && secrets.GREEN_INVOICE_SANDBOX_API_ID || '' }}
          K35: ${{ steps.mode.outputs.mode == 'keynames' && secrets.GREEN_INVOICE_SANDBOX_API_SECRET || '' }}
          K36: ${{ steps.mode.outputs.mode == 'keynames' && secrets.GREENINVOICE_API_ID || '' }}
          K37: ${{ steps.mode.outputs.mode == 'keynames' && secrets.GREENINVOICE_API_SECRET || '' }}
          K38: ${{ steps.mode.outputs.mode == 'keynames' && secrets.GREEN_INVOICE_API_ID || '' }}
          K39: ${{ steps.mode.outputs.mode == 'keynames' && secrets.GREEN_INVOICE_API_SECRET || '' }}
          K40: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SANDBOX_API_ID_ || '' }}
          K41: ${{ steps.mode.outputs.mode == 'keynames' && secrets.SANDBOX_API_ID || '' }}
          K42: ${{ steps.mode.outputs.mode == 'keynames' && secrets.SANDBOX_API_SECRET || '' }}
          K43: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_ID || '' }}
          K44: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_SECRET || '' }}
          K45: ${{ steps.mode.outputs.mode == 'keynames' && secrets.MORNING_KEY || '' }}
          K46: ${{ steps.mode.outputs.mode == 'keynames' && secrets.GREENINVOICE_SANDBOX_CLIENT_SECRET || '' }}
          V1: ${{ steps.mode.outputs.mode == 'keynames' && vars.MORNING_SANDBOX_CLIENT_ID || '' }}
          V2: ${{ steps.mode.outputs.mode == 'keynames' && vars.MORNING_SANDBOX_CLIENT_SECRET || '' }}
          V3: ${{ steps.mode.outputs.mode == 'keynames' && vars.STAGING_FUNCTIONS_TOKEN || '' }}
        run: |
          L=""; i=0
          for n in MORNING_SANDBOX_CLIENT_ID MORNING_SANDBOX_CLIENT_SECRET MORNING_SANDBOX_API_KEY MORNING_SANDBOX_SECRET MORNING_SANDBOX_ID MORNING_SANDBOX_KEY MORNING_SANDBOX_API_SECRET MORNING_SANDBOX_API_ID MORNING_SANDBOX_CLIENTID MORNING_SANDBOX_CLIENT SANDBOX_CLIENT_ID SANDBOX_CLIENT_SECRET MORNING_SANBOX_CLIENT_ID MORNING_SANBOX_CLIENT_SECRET MORNING_SANDBOX_CLIENT_SECERT MORNING_SANDBOX_CLIENT_SECRETS GREENINVOICE_SANDBOX_CLIENT_ID GREEN_INVOICE_SANDBOX_CLIENT_ID MORNING_SANDBOX_CLIEN_ID MORNING_SANDBOX_CLINET_ID MORNING_SANDBOX_CLIENT_ID1 MORNING_SANDBOX MORNING_SANDBOX_TOKEN MORNING_TEST_CLIENT_ID MORNING_TEST_CLIENT_SECRET SANDBOX_MORNING_CLIENT_ID SANDBOX_MORNING_CLIENT_SECRET MORNING_SANDBOX_CLIENT_ID_STAGING MORNING_SANDBOX_CLIENT_SECRET_STAGING MORNING_DEV_CLIENT_ID MORNING_DEV_CLIENT_SECRET GREENINVOICE_SANDBOX_API_ID GREENINVOICE_SANDBOX_API_SECRET GREEN_INVOICE_SANDBOX_API_ID GREEN_INVOICE_SANDBOX_API_SECRET GREENINVOICE_API_ID GREENINVOICE_API_SECRET GREEN_INVOICE_API_ID GREEN_INVOICE_API_SECRET MORNING_SANDBOX_API_ID_ SANDBOX_API_ID SANDBOX_API_SECRET MORNING_ID MORNING_SECRET MORNING_KEY GREENINVOICE_SANDBOX_CLIENT_SECRET; do
            i=$((i+1)); v=$(eval echo "\${K$i:-}"); [ -n "$v" ] && L="$L $n=✅(${#v})"
          done
          V=""; [ -n "$V1" ] && V="$V MORNING_SANDBOX_CLIENT_ID(var)=✅"; [ -n "$V2" ] && V="$V MORNING_SANDBOX_CLIENT_SECRET(var)=✅"; [ -n "$V3" ] && V="$V STAGING_FUNCTIONS_TOKEN(var)=✅"
          echo "::notice title=staging-result::סודות שנמצאו:${L:- אף אחד} | משתנים (Variables):${V:- אף אחד}"
          exit 0
      - name: Run on Staging
        if: steps.mode.outputs.mode != 'keynames' && steps.mode.outputs.mode != 'e2emorning'
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          STAGING_PUBLISHABLE_KEY: ${{ vars.STAGING_PUBLISHABLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ (steps.mode.outputs.mode == 'growperms' && secrets.STAGING_FUNCTIONS_TOKEN) || secrets.SUPABASE_ACCESS_TOKEN }}
          RUN_MODE: ${{ steps.mode.outputs.mode }}
          SUPABASE_STAGING_READ_TOKEN: ${{ secrets.SUPABASE_STAGING_READ_TOKEN }}
          GROW_WEBHOOK_TOKEN: ${{ env.GROW_WEBHOOK_TOKEN }}
          HDM_CRON_SECRET: ${{ env.HDM_CRON_SECRET }}
          # סודות Grow — מועברים רק לבדיקת קיום (growsecrets); הסקריפט לא מדפיס ערכים
          GROW_USER_ID: ${{ steps.mode.outputs.mode == 'growsecrets' && secrets.GROW_USER_ID || '' }}
          GROW_PAGE_CODE: ${{ steps.mode.outputs.mode == 'growsecrets' && secrets.GROW_PAGE_CODE || '' }}
          GROW_API_KEY: ${{ steps.mode.outputs.mode == 'growsecrets' && secrets.GROW_API_KEY || '' }}
          GROW_CLIENT_ID: ${{ steps.mode.outputs.mode == 'growsecrets' && secrets.GROW_CLIENT_ID || '' }}
          GROW_SANDBOX_USER_ID: ${{ steps.mode.outputs.mode == 'growsecrets' && secrets.GROW_SANDBOX_USER_ID || '' }}
          GROW_SANDBOX_PAGE_CODE: ${{ steps.mode.outputs.mode == 'growsecrets' && secrets.GROW_SANDBOX_PAGE_CODE || '' }}
          GROW_SANDBOX_API_KEY: ${{ steps.mode.outputs.mode == 'growsecrets' && secrets.GROW_SANDBOX_API_KEY || '' }}
          MORNING_CLIENT_ID: ${{ steps.mode.outputs.mode == 'growsecrets' && secrets.MORNING_CLIENT_ID || '' }}
          MORNING_CLIENT_SECRET: ${{ steps.mode.outputs.mode == 'growsecrets' && secrets.MORNING_CLIENT_SECRET || '' }}
          MORNING_API_KEY: ${{ steps.mode.outputs.mode == 'growsecrets' && secrets.MORNING_API_KEY || '' }}
          MORNING_API_SECRET: ${{ steps.mode.outputs.mode == 'growsecrets' && secrets.MORNING_API_SECRET || '' }}
          MORNING_SANDBOX_CLIENT_ID: ${{ steps.mode.outputs.mode == 'growsecrets' && secrets.MORNING_SANDBOX_CLIENT_ID || '' }}
          MORNING_SANDBOX_CLIENT_SECRET: ${{ steps.mode.outputs.mode == 'growsecrets' && secrets.MORNING_SANDBOX_CLIENT_SECRET || '' }}
          STAGING_FUNCTIONS_TOKEN: ${{ steps.mode.outputs.mode == 'growsecrets' && secrets.STAGING_FUNCTIONS_TOKEN || '' }}
        run: bash scripts/staging_db/run.sh "$RUN_MODE"

      - name: Morning e2e — rotate test secrets, charging stays off (always)
        if: always() && contains(fromJSON('["e2emorning","e2eflow","e2epay"]'), steps.mode.outputs.mode)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_FUNCTIONS_TOKEN }}
        run: |
          REF=ousepgdvzammgkxkweze
          OUT=$(supabase secrets set --project-ref "$REF" MORNING_LIVE=0 HDM_ENV=staging MORNING_WEBHOOK_TOKEN=$(openssl rand -hex 32) MORNING_WEBHOOK_SECRET=$(openssl rand -hex 32) HDM_CRON_SECRET=$(openssl rand -hex 32) 2>&1) \
            && echo "::notice title=e2emorning-off::Staging: MORNING_LIVE=0, סודות הבדיקה הוחלפו" \
            || echo "::error title=e2emorning-off::$(printf '%s' "$OUT" | grep -vE 'eyJ|sbp_' | tail -n 4 | tr '\n' ' ' | cut -c1-300)"
      - name: Target mail — remove fake Brevo key, switch off, rotate cron secret (always)
        if: always() && steps.mode.outputs.mode == 'e2etargetmail'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_FUNCTIONS_TOKEN }}
        run: |
          REF=ousepgdvzammgkxkweze
          supabase secrets unset --project-ref "$REF" BREVO_API_KEY MAIL_FROM TARGET_EMAILS_LIVE >/dev/null 2>&1 || true
          OUT=$(supabase secrets set --project-ref "$REF" HDM_CRON_SECRET=$(openssl rand -hex 32) 2>&1) \
            && echo "::notice title=e2etargetmail-off::Staging: מפתח הבדיקה של Brevo הוסר, ההתראות כבויות, סוד המשימה הוחלף" \
            || echo "::error title=e2etargetmail-off::$(printf '%s' "$OUT" | grep -vE 'eyJ|sbp_' | tail -n 4 | tr '\n' ' ' | cut -c1-300)"
      - name: Worker e2e — remove fake Brevo key, rotate cron secret (always)
        if: always() && steps.mode.outputs.mode == 'e2eworker'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_FUNCTIONS_TOKEN }}
        run: |
          REF=ousepgdvzammgkxkweze
          supabase secrets unset --project-ref "$REF" BREVO_API_KEY MAIL_FROM >/dev/null 2>&1 || true
          OUT=$(supabase secrets set --project-ref "$REF" HDM_CRON_SECRET=$(openssl rand -hex 32) 2>&1) \
            && echo "::notice title=e2eworker-off::Staging: מפתח הבדיקה של Brevo הוסר, סוד המשימה הוחלף" \
            || echo "::error title=e2eworker-off::$(printf '%s' "$OUT" | grep -vE 'eyJ|sbp_' | tail -n 4 | tr '\n' ' ' | cut -c1-300)"
      # ---- keynames: מחפש באילו שמות נשמרו מפתחות ה-Sandbox (קיום/אורך בלבד, בלי ערכים) ----
      - name: Grow e2e — switch functions off (always)
        if: always() && steps.mode.outputs.mode == 'e2egrow'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_FUNCTIONS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          REF=ousepgdvzammgkxkweze
          OUT=$(supabase secrets set --project-ref "$REF" GROW_LIVE=0 GROW_MOCK=0 HDM_ENV=staging GROW_API_BASE=https://sandbox.meshulam.co.il/api/light/server/1.0 \
            GROW_WEBHOOK_TOKEN=$(openssl rand -hex 32) HDM_CRON_SECRET=$(openssl rand -hex 32) GROW_MOCK_SECRET=$(openssl rand -hex 32) 2>&1) \
            && echo "::notice title=e2egrow-off::הפונקציות ב-Staging כבויות: GROW_LIVE=0, GROW_MOCK=0, סודות הבדיקה הוחלפו" \
            || echo "::error title=e2egrow-off::כיבוי לא בוצע: $(printf '%s' "$OUT" | grep -vE 'eyJ|sb_secret' | tail -n 5 | tr '\n' ' ' | cut -c1-400)"
      - name: Screenshots (e2e only)
        if: always() && (steps.mode.outputs.mode == 'e2e' || steps.mode.outputs.mode == 'e2eadmin' || steps.mode.outputs.mode == 'e2edesign')
        uses: actions/upload-artifact@v5
        with:
          name: e2e-screenshots
          path: /tmp/hdm-shots
          if-no-files-found: ignore
          retention-days: 7

  # צילומי המסך של העיצוב: נשמרים בענף staging-tests/screens. ג'וב נפרד — בלי סביבת staging ובלי סודות.
  publish-design-shots:
    needs: staging-db
    if: always() && needs.staging-db.outputs.mode == 'e2edesign'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: e2e-screenshots
          path: shots
      - name: Push screenshots to staging-tests/screens
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          ls -la shots
          cd shots
          git init -q -b staging-tests/screens
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "design screenshots from $SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:staging-tests/screens
